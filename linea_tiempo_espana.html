<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia de España Contemporánea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Academic Light Theme */
            --primary: #1d4ed8;      /* Blue 700 */
            --primary-dark: #1e3a8a; /* Blue 900 */
            --bg-color: #f8fafc;     /* Slate 50 */
            --text-main: #1e293b;    /* Slate 800 */
            --text-muted: #64748b;   /* Slate 500 */
            --card-bg: #ffffff;      
            --border-color: #e2e8f0; /* Slate 200 */
            --line-color: #cbd5e1;   /* Slate 300 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; 
            margin: 0;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #sidebar {
            background: #0f172a; /* Dark sidebar for contrast */
            color: #f8fafc;
            border-right: 1px solid #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }

        .menu-item {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .menu-item.active {
            background: rgba(255,255,255,0.1);
            border-left-color: #3b82f6; /* Bright blue indicator */
        }

        .timeline-container {
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: auto; 
            cursor: grab;
            position: relative;
            display: flex;
            align-items: center; 
            scroll-behavior: auto; /* Changed from smooth to avoid jumps during zoom */
        }
        .timeline-container:active { cursor: grabbing; }

        .timeline-track-wrapper {
            position: relative;
            display: block;
            height: 100%;
            min-height: 800px; /* Ensure enough height for 3 levels of staggering */
        }

        .timeline-line {
            height: 4px;
            background: var(--line-color);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 4px;
        }

        .event-wrapper {
            position: absolute;
            top: 50%;
            width: 2px;
            overflow: visible;
            z-index: 10;
        }

        .event-dot {
            position: absolute;
            top: -7px;
            left: -7px;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 4px solid var(--primary);
            border-radius: 50%;
            z-index: 20;
            transition: transform 0.2s ease;
        }
        
        .event-wrapper:hover .event-dot {
            transform: scale(1.3);
            background: var(--primary);
        }

        .connector {
            position: absolute;
            left: 0;
            width: 2px;
            background: var(--line-color);
            z-index: 5;
        }
        .event-wrapper.top .connector { bottom: 0; }
        .event-wrapper.bottom .connector { top: 0; }

        .event-card {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            z-index: 30;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .event-wrapper:hover .event-card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 40;
        }

        .year-badge {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: #e0e7ff; 
            color: #3730a3; 
        }

        .event-desc {
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.5;
        }
        .event-desc ul { 
            list-style-type: disc; 
            padding-left: 1.2rem; 
            margin: 0; 
        }
        .event-desc li { 
            margin-bottom: 0.25rem; 
        }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #print-title { display: none; }

        @media print {
            @page { size: A3 landscape; margin: 10mm; }
            body { background: white !important; overflow: visible !important; }
            #sidebar, .print-hide, header { display: none !important; }
            main { padding: 0 !important; overflow: visible !important; display: block !important; }
            
            #print-title {
                display: block !important;
                text-align: center !important;
                font-size: 28pt !important;
                font-weight: bold !important;
                margin-top: 5mm !important;
                margin-bottom: 15mm !important;
                color: black !important;
                width: 100% !important;
            }
            
            .timeline-container { 
                overflow: visible !important; width: 100% !important; height: auto !important;
                display: block !important; 
            }
            .timeline-track-wrapper { 
                height: 800px !important; 
                page-break-inside: avoid;
            }
            .event-card {
                box-shadow: none !important;
                border: 1px solid #000 !important;
                border-top: 4px solid #000 !important;
                -webkit-print-color-adjust: exact;
                page-break-inside: avoid;
            }
            .timeline-line, .connector {
                background: #000 !important;
                -webkit-print-color-adjust: exact;
            }
            .event-dot {
                border-color: #000 !important;
                -webkit-print-color-adjust: exact;
            }
            .category-tag {
                background: #eee !important;
                color: #000 !important;
                border: 1px solid #ccc;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="flex h-screen w-full">

<aside id="sidebar" class="w-72 flex-shrink-0 flex flex-col h-full absolute md:relative transform -translate-x-full md:translate-x-0">
    <div class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">
                Línea del Tiempo
            </h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Historia de España</p>
        </div>
        <button id="close-menu" class="md:hidden text-slate-400 hover:text-white">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
    </div>
    
    <div class="flex-1 overflow-y-auto py-4 px-2 space-y-1" id="menu-container">
        <!-- Menú generado por JS -->
    </div>

    <div class="p-4 border-t border-slate-700 space-y-2">
        <button onclick="exportAllJSON()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-lg transition border border-slate-600 flex items-center justify-center gap-2">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar App Completa
        </button>
    </div>
</aside>

<main class="flex-1 flex flex-col h-full relative min-w-0 bg-white">
    <header class="h-16 px-6 border-b border-slate-200 bg-white flex items-center justify-between z-30 shrink-0 shadow-sm">
        <div class="flex items-center gap-4">
            <button id="toggle-sidebar" class="text-slate-500 hover:text-slate-800 hover:bg-slate-100 p-2 -ml-2 rounded-lg transition" title="Mostrar/Ocultar menú">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex items-center gap-3">
                <span id="header-number" class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs border border-blue-200"></span>
                <h2 id="header-title" class="text-lg md:text-xl font-bold text-slate-800 truncate"></h2>
            </div>
        </div>
        
        <div class="flex items-center gap-2 print-hide">
            <!-- Zoom Controls -->
            <div class="hidden md:flex items-center gap-1 mr-2 bg-slate-100 rounded-lg p-1 border border-slate-200">
                <button onclick="zoomOut()" class="p-1 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition" title="Alejar (Vista general)">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
                <span id="zoom-level" class="text-xs font-bold text-slate-700 w-10 text-center">100%</span>
                <button onclick="zoomIn()" class="p-1 text-slate-600 hover:text-slate-900 hover:bg-slate-200 rounded transition" title="Acercar (Ver detalles)">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
            </div>
            <!-- Actions -->
            <button onclick="window.print()" class="p-2 md:px-4 md:py-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-lg text-slate-700 text-sm font-medium transition flex items-center gap-2" title="Imprimir (A3 Recomendado)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                <span class="hidden md:inline">Imprimir A3</span>
            </button>
            <button onclick="exportCurrentJSON()" class="p-2 md:px-4 md:py-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-lg text-slate-700 text-sm font-medium transition flex items-center gap-2" title="Exportar esta línea">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span class="hidden md:inline">Exportar JSON</span>
            </button>
            <button onclick="openModal()" class="p-2 md:px-4 md:py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="hidden md:inline">Añadir Hecho</span>
            </button>
        </div>
    </header>

    <div id="print-title"></div>

    <div id="timeline-scroll-area" class="timeline-container">
        <div id="timeline-track" class="timeline-track-wrapper">
            <div class="timeline-line"></div>
            <!-- Eventos generados dinámicamente -->
        </div>
    </div>
</main>

<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="bg-white rounded-xl w-full max-w-md relative z-10 border border-slate-200 shadow-2xl p-6">
        <h3 class="text-xl font-bold text-slate-800 mb-4">Nuevo Hecho Histórico</h3>
        <form id="add-form" onsubmit="saveEvent(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Año/Fecha</label>
                    <input type="text" id="i-year" required class="w-full bg-white border border-slate-300 text-slate-800 px-3 py-2 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Categoría</label>
                    <input type="text" id="i-cat" placeholder="Opcional" class="w-full bg-white border border-slate-300 text-slate-800 px-3 py-2 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Descripción (Puntos para crear viñetas)</label>
                <textarea id="i-desc" required rows="3" class="w-full bg-white border border-slate-300 text-slate-800 px-3 py-2 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="Ejemplo: Primer suceso. Segundo suceso."></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Posición Visual</label>
                <select id="i-pos" class="w-full bg-white border border-slate-300 text-slate-800 px-3 py-2 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition">
                    <option value="top">Arriba</option>
                    <option value="bottom">Abajo</option>
                </select>
            </div>
            <div>
                <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">
                    <label>Ubicación Temporal (0% al 100%)</label>
                    <span id="i-perc-val" class="text-blue-600 font-bold">50%</span>
                </div>
                <input type="range" id="i-perc" min="0" max="100" value="50" class="w-full accent-blue-600" oninput="document.getElementById('i-perc-val').textContent=this.value+'%'">
            </div>
            <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-medium transition">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition">Guardar Hecho</button>
            </div>
        </form>
    </div>
</div>

    function init() {
        renderMenu();
        loadTimeline(0);
        
        // Mouse drag scrolling functionality
        const slider = document.getElementById('timeline-scroll-area');
        let isDown = false; let startX; let scrollLeft;
        slider.addEventListener('mousedown', (e) => {
            isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => { isDown = false; });
        slider.addEventListener('mouseup', () => { isDown = false; });
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return; 
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            slider.scrollLeft = scrollLeft - (x - startX) * 2;
        });

        // Mobile and Desktop menu functionality
        const sidebar = document.getElementById('sidebar');
        
        document.getElementById('toggle-sidebar').onclick = () => {
            if (window.innerWidth < 768) {
                // Comportamiento en móviles: mostrar superpuesto
                sidebar.classList.remove('-translate-x-full');
            } else {
                // Comportamiento en escritorio: colapsar a la izquierda
                sidebar.classList.toggle('md:-ml-72');
                
                // Recalcular el tamaño y posición de los eventos al cambiar el ancho de la pantalla (tras la animación de 0.3s)
                setTimeout(() => {
                    loadTimeline(currentId, false);
                }, 300);
            }
        };
        
        document.getElementById('close-menu').onclick = () => sidebar.classList.add('-translate-x-full');
    }

    function renderMenu() {
        const cont = document.getElementById('menu-container');
        cont.innerHTML = '';
        db.forEach(tl => {
            const btn = document.createElement('button');
            btn.className = `menu-item w-full text-left px-3 py-2.5 rounded-lg flex items-start gap-3 ${tl.id === currentId ? 'active text-white' : 'text-slate-400'}`;
            btn.innerHTML = `
                <span class="shrink-0 w-6 h-6 rounded flex items-center justify-center text-xs font-bold ${tl.id === currentId ? 'bg-blue-600 text-white' : 'bg-slate-800'}">${tl.number}</span>
                <span class="text-sm font-medium leading-tight mt-0.5">${tl.title}</span>
            `;
            btn.onclick = () => {
                currentZoom = 1; // Reset zoom on category change
                document.getElementById('zoom-level').textContent = '100%';
                loadTimeline(tl.id);
                if(window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
            };
            cont.appendChild(btn);
        });
    }

    // Convert dots into clean HTML lists
    function formatText(text) {
        const parts = text.split('.').filter(p => p.trim().length > 0);
        if(parts.length === 1) return parts[0] + '.';
        return `<ul>${parts.map(p => `<li>${p.trim()}.</li>`).join('')}</ul>`;
    }

    function loadTimeline(id, resetScroll = true) {
        currentId = id;
        renderMenu();
        const tl = db.find(t => t.id === id);
        
        document.getElementById('header-number').textContent = tl.number;
        document.getElementById('header-title').textContent = tl.title;
        document.getElementById('print-title').textContent = tl.number + ". " + tl.title;
        
        const track = document.getElementById('timeline-track');
        track.innerHTML = '<div class="timeline-line"></div>';
        
        const scrollArea = document.getElementById('timeline-scroll-area');
        
        // Dynamic width calculation guaranteeing readability, adapting to zoom level
        const baseWidth = Math.max(scrollArea.clientWidth, tl.events.length * 280);
        const actualWidth = baseWidth * currentZoom;
        
        track.style.width = `${actualWidth}px`;
        
        // PADDING: Prevents first and last cards from getting cut off on the sides
        const padding = 160; 
        const usableWidth = actualWidth - (padding * 2);
        
        const line = track.querySelector('.timeline-line');
        line.style.left = `${padding}px`;
        line.style.right = `${padding}px`;
        
        // Collision detection levels: 3 levels up, 3 levels down
        const topLevels = [-1000, -1000, -1000];
        const bottomLevels = [-1000, -1000, -1000];
        const levelHeights = [40, 160, 280]; // Distance from center line
        
        const minDistancePx = 300; // Minimum horizontal distance between cards to avoid overlap

        const sortedEvents = [...tl.events].sort((a, b) => a.perc - b.perc);

        sortedEvents.forEach((ev, index) => {
            const isTop = ev.pos === 'top';
            const levels = isTop ? topLevels : bottomLevels;
            let assignedLevel = 0;

            // Convert % to actual pixels within the usable area
            const pxPos = (ev.perc / 100) * usableWidth;

            // Find closest free track (level) to avoid overlaps
            for(let l = 0; l < 3; l++) {
                if(pxPos >= levels[l] + minDistancePx) {
                    assignedLevel = l;
                    break;
                }
            }
            
            // Fallback: if all full, pick the minimum penalty
            if (pxPos < levels[assignedLevel] + minDistancePx) {
                assignedLevel = levels.indexOf(Math.min(...levels));
            }

            levels[assignedLevel] = pxPos;
            
            const dist = levelHeights[assignedLevel];
            // Final position applying padding
            const finalLeft = padding + pxPos;
            
            const wrapper = document.createElement('div');
            wrapper.className = `event-wrapper ${ev.pos} fade-in`;
            wrapper.style.left = `${finalLeft}px`;
            wrapper.style.animationDelay = `${index * 0.04}s`;

            let catHtml = ev.cat ? `<span class="category-tag">${ev.cat}</span>` : '';
            
            wrapper.innerHTML = `
                <div class="event-dot"></div>
                <div class="connector" style="height: ${dist}px;"></div>
                <div class="event-card" style="${isTop ? `bottom: ${dist}px;` : `top: ${dist}px;`}">
                    ${catHtml}
                    <div class="year-badge">${ev.year}</div>
                    <div class="event-desc">${formatText(ev.desc)}</div>
                </div>
            `;
            track.appendChild(wrapper);
        });
        
        if (resetScroll) {
            scrollArea.scrollLeft = 0;
        }
    }

    function zoomIn() {
        if(currentZoom < 3) {
            const scrollArea = document.getElementById('timeline-scroll-area');
            const centerRatio = (scrollArea.scrollLeft + scrollArea.clientWidth / 2) / scrollArea.scrollWidth;
            
            currentZoom += 0.2;
            document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
            loadTimeline(currentId, false);
            
            scrollArea.scrollLeft = (centerRatio * scrollArea.scrollWidth) - (scrollArea.clientWidth / 2);
        }
    }

    function zoomOut() {
        if(currentZoom > 0.4) {
            const scrollArea = document.getElementById('timeline-scroll-area');
            const centerRatio = (scrollArea.scrollLeft + scrollArea.clientWidth / 2) / scrollArea.scrollWidth;
            
            currentZoom -= 0.2;
            document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
            loadTimeline(currentId, false);
            
            scrollArea.scrollLeft = (centerRatio * scrollArea.scrollWidth) - (scrollArea.clientWidth / 2);
        }
    }

    function openModal() {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal').classList.add('flex');
        document.getElementById('add-form').reset();
        document.getElementById('i-perc-val').textContent = '50%';
    }
    
    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        document.getElementById('modal').classList.remove('flex');
    }

    function saveEvent(e) {
        e.preventDefault();
        const tl = db.find(t => t.id === currentId);
        const newEv = {
            year: document.getElementById('i-year').value,
            pos: document.getElementById('i-pos').value,
            perc: parseInt(document.getElementById('i-perc').value),
            desc: document.getElementById('i-desc').value
        };
        const cat = document.getElementById('i-cat').value;
        if(cat.trim()) newEv.cat = cat;
        
        tl.events.push(newEv);
        closeModal();
        loadTimeline(currentId, false); // Reload without resetting scroll
    }

    function download(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        a.click(); URL.revokeObjectURL(url);
    }

    function exportCurrentJSON() {
        const tl = db.find(t => t.id === currentId);
        download(tl, `Linea_${tl.number}_HistoriaEspana.json`);
    }

    function exportAllJSON() {
        download(db, `HistoriaEspana_Completa.json`);
    }

    window.onload = init;
</script>
</body>
