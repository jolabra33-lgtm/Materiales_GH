<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Comparador Estadístico</title>

    <!-- Icono y color del navegador -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <meta name="theme-color" content="#1c3456">

    <!-- Soporte PWA / "Añadir a pantalla de inicio" en iPad -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GeoStats Pro">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc;
               padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
               padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800">
    <div class="min-h-screen p-4 md:p-8">
        <div class="max-w-[1400px] w-full mx-auto space-y-4">
            
            <!-- Cabecera -->
            <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-earth-americas text-blue-600"></i>
                        GeoStats Pro
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">Datos estimados globales (2020) y nacionales</p>
                </div>
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button onclick="app.switchDataset('countries')" id="btn-countries" class="px-6 py-2 rounded-lg text-sm font-medium transition-all bg-white text-blue-600 shadow-sm">Países</button>
                    <button onclick="app.switchDataset('regions')" id="btn-regions" class="px-6 py-2 rounded-lg text-sm font-medium transition-all text-slate-500 hover:text-slate-700">CC.AA. (España)</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
                
                <!-- Panel Lateral (Buscador y Lista) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col sticky top-4 md:top-8 max-h-[85vh]">
                    <h2 class="font-semibold text-lg mb-3 flex items-center justify-between">
                        Territorios
                        <div class="flex items-center gap-2">
                            <button onclick="app.clearSelection()" class="text-xs font-medium text-slate-500 hover:text-red-600 bg-slate-100 hover:bg-red-50 px-2.5 py-1 rounded-md transition-colors" title="Borrar toda la selección">
                                <i class="fa-solid fa-trash-can mr-1"></i> Limpiar
                            </button>
                            <span id="selection-count" class="bg-blue-100 text-blue-700 text-xs py-1 px-2 rounded-full font-bold">0</span>
                        </div>
                    </h2>
                    <div class="relative mb-3 flex-shrink-0">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" oninput="app.filterList()" placeholder="Buscar territorio..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 pl-9 pr-4 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                    </div>
                    <div id="territories-list" class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-1.5 pb-2">
                        <!-- Generado por JS -->
                    </div>
                </div>

                <div class="lg:col-span-3 flex flex-col gap-4">
                    
                    <!-- Carrusel de Métricas -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2">
                        <div class="relative">
                            <div id="metrics-container" class="flex overflow-x-auto hide-scrollbar gap-2 p-1 cursor-grab active:cursor-grabbing scroll-smooth">
                                <!-- Generado por JS -->
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative flex flex-col h-[350px] xl:h-[400px]">
                        <div class="flex justify-between items-center mb-2 flex-shrink-0">
                            <h2 id="chart-title" class="text-lg font-bold text-slate-800">Comparativa</h2>
                            <div class="flex items-center gap-1 sm:gap-2">
                                <button onclick="app.toggleSort()" id="btn-sort" class="w-9 h-7 rounded-md flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all" title="Ordenar Mayor/Menor">
                                    <i class="fa-solid fa-arrow-down-9-1 text-sm"></i>
                                </button>
                                <div class="w-px h-5 bg-slate-200 mx-1"></div>
                                <div class="flex bg-slate-100 p-1 rounded-lg">
                                    <button onclick="app.setChartType('bar')" id="btn-bar" class="w-9 h-7 rounded-md flex items-center justify-center bg-white text-blue-600 shadow-sm transition-all"><i class="fa-solid fa-chart-simple text-sm"></i></button>
                                    <button onclick="app.setChartType('line')" id="btn-line" class="w-9 h-7 rounded-md flex items-center justify-center text-slate-400 hover:text-slate-600 transition-all"><i class="fa-solid fa-chart-line text-sm"></i></button>
                                </div>
                                <div class="w-px h-5 bg-slate-200 mx-1"></div>
                                <button onclick="app.downloadChart()" class="w-9 h-7 rounded-md flex items-center justify-center bg-slate-100 text-slate-600 hover:bg-blue-100 hover:text-blue-600 transition-all" title="Descargar Gráfico como PNG">
                                    <i class="fa-solid fa-download text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 w-full relative">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 hidden rounded-2xl">
                            <i class="fa-solid fa-chart-pie text-5xl text-slate-200 mb-3"></i>
                            <p class="text-slate-500 font-medium">Selecciona al menos un territorio</p>
                        </div>
                    </div>

                    <!-- Tarjetas Detalladas -->
                    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 pb-8">
                        <!-- Generado por JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300" id="edit-modal-content">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center flex-shrink-0">
                <h3 class="text-lg font-bold text-slate-800" id="edit-modal-title">Editar Territorio</h3>
                <button onclick="app.closeEditModal()" class="text-slate-400 hover:text-slate-600 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-4" id="edit-modal-body">
                <!-- Generado por JS -->
            </div>
            <div class="p-5 border-t border-slate-100 flex justify-end gap-3 bg-slate-50 rounded-b-2xl flex-shrink-0">
                <button onclick="app.closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-all">Cancelar</button>
                <button id="save-edit-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 transition-all shadow-sm">Guardar Cambios</button>
            </div>
        </div>
    </div>

                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                ctx.drawImage(canvas, 0, 0);
                
                const url = tempCanvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = url;
                a.download = `Grafico_${state.dataset}_${state.selectedMetric}.png`;
                a.click();
            },

                let data = db[state.dataset].data.filter(d => state.selectedIds.includes(d.id));
                data.sort((a, b) => {
                    const vA = a[state.selectedMetric];
                    const vB = b[state.selectedMetric];
                    const aMissing = (vA === null || vA === undefined);
                    const bMissing = (vB === null || vB === undefined);
                    if (aMissing && bMissing) return 0;
                    if (aMissing) return 1;
                    if (bMissing) return -1;
                    return state.sortOrder === 'desc' ? vB - vA : vA - vB;
                });
                return data;

                const selectedData = app.getSortedData();
                const emptyState = document.getElementById('empty-state');
                
                if (selectedData.length === 0) {
                    if (chartInstance) chartInstance.destroy();
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                if (typeof Chart === 'undefined') {
                    // Chart.js no ha podido cargarse (p.ej. sin conexión al abrir la app).
                    // No bloqueamos el resto de la interfaz: sidebar y tarjetas siguen funcionando.
                    console.warn('Chart.js no está disponible; no se puede dibujar el gráfico.');
                    return;
                }

                const ctx = document.getElementById('mainChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: state.chartType,
                    data: {
                        labels: selectedData.map(d => d.name),
                        datasets: [{
                            label: metricObj.name,
                            data: selectedData.map(d => d[state.selectedMetric]),
                            backgroundColor: state.chartType === 'bar' ? metricObj.color : metricObj.color + '33',
                            borderColor: metricObj.color,
                            borderWidth: 2,
                            borderRadius: state.chartType === 'bar' ? 4 : 0,
                            fill: state.chartType === 'line',
                            tension: 0.3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: metricObj.color,
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                grid: { borderDash: [4, 4], color: '#f1f5f9' },
                                ticks: { font: {size: 11}, color: '#94a3b8' }
                            },
                            x: { 
                                grid: { display: false },
                                ticks: { font: {size: 11}, color: '#64748b', maxRotation: 45, minRotation: 0 }
                            }
                        },
                        interaction: {
                            intersect: false,
                            mode: 'index',
                        }
                    }
                });
            },

            renderCards: () => {
                const container = document.getElementById('cards-container');
                const selectedData = app.getSortedData();
                const metrics = db[state.dataset].metrics;
                
                let html = '';
                selectedData.forEach(item => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 relative overflow-hidden group hover:border-blue-200 transition-colors">
                            <button onclick="app.openEditModal('${item.id}')" class="absolute top-3 right-3 text-slate-400 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-md transition-all z-20" title="Editar datos">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <h3 class="text-base font-bold text-slate-800 mb-3 border-b border-slate-100 pb-2 relative z-10 pr-8">${item.name}</h3>
                            <div class="grid grid-cols-2 gap-2 relative z-10">
                    `;
                    metrics.forEach(m => {
                        const isHighlighted = state.selectedMetric === m.id;
                        html += `
                            <div class="flex flex-col p-1.5 rounded-lg ${isHighlighted ? 'bg-blue-50/50' : ''}">
                                <div class="flex items-center gap-1.5 text-slate-500 mb-0.5">
                                    <i class="fa-solid ${m.icon} text-[9px] ${isHighlighted ? 'text-blue-500' : ''}"></i>
                                    <span class="text-[9px] font-semibold uppercase tracking-wider truncate" title="${m.name}">${m.name}</span>
                                </div>
                                <span class="text-xs font-bold ${isHighlighted ? 'text-slate-900' : 'text-slate-700'}">
                                    ${m.fmt(item[m.id])}
                                </span>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            },

            renderAll: () => {
                app.renderSidebar();
                app.renderMetrics();
                app.renderChart();
                app.renderCards();
            }
        };

        window.onload = app.renderAll;

        const slider = document.getElementById('metrics-container');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => { isDown = false; });
        slider.addEventListener('mouseup', () => { isDown = false; });
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>
</body>
